databases:
  - name: bromade-db
    plan: free
    databaseName: bromade
    user: bromade

services:
  - type: web
    name: bromade-api
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python -m gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 60"
    healthCheckPath: /health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: bromade-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: OTP_PROVIDER
        value: mock
      - key: PAYMENT_GATEWAY
        value: mock_razorpay
