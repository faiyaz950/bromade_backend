<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · {{ brand }}</title>
  <style>
    :root { --ink: #16172A; --muted: #5F6372; --accent: #E85D10; --line: #ECE6DD; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 16px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: #FFFBF7; }
    header { background: #fff; border-bottom: 1px solid var(--line); }
    header .wrap { display: flex; align-items: center; gap: 16px; padding-top: 16px; padding-bottom: 16px; }
    header strong { font-size: 20px; color: var(--accent); }
    nav { margin-left: auto; display: flex; gap: 16px; font-size: 14px; }
    nav a { color: var(--muted); text-decoration: none; }
    nav a:hover { color: var(--accent); }
    .wrap { max-width: 760px; margin: 0 auto; padding: 0 20px; }
    main { padding: 32px 0 64px; }
    h1 { font-size: 30px; line-height: 1.25; margin: 0 0 4px; }
    h2 { font-size: 20px; margin: 32px 0 8px; }
    .meta { color: var(--muted); font-size: 14px; margin-bottom: 24px; }
    p, li { color: #2B2D3D; }
    a { color: var(--accent); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 20px; margin: 16px 0; }
    footer { color: var(--muted); font-size: 13px; padding: 24px 0 40px; border-top: 1px solid var(--line); }
  </style>
</head>
<body>
  <header>
    <div class="wrap">
      <strong>{{ brand }}</strong>
      <nav>
        <a href="/privacy/">Privacy</a>
        <a href="/terms/">Terms</a>
        <a href="/delete-account/">Delete account</a>
      </nav>
    </div>
  </header>
  <main>
    <div class="wrap">
      <h1>{{ title }}</h1>
      <div class="meta">Effective {{ effective_date }}</div>
      {% block content %}{% endblock %}
    </div>
  </main>
  <footer>
    <div class="wrap">© {{ company }} · {{ brand }} home services · <a href="mailto:{{ support_email }}">{{ support_email }}</a></div>
  </footer>
</body>
</html>
